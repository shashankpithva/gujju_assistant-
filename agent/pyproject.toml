[project]
name = "gujju-survey-agent"
version = "0.2.0"
description = "AI phone agent that calls numbers from a sheet and runs a Gujarati water-supply survey (LiveKit Agents)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "gspread>=6.1",
    "httpx>=0.28.1",
    "livekit-agents[deepgram,google,groq,sarvam,silero]>=1.8.9",
    "livekit-plugins-noise-cancellation>=0.3.2",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The LLM's instructions are prose: one line per rule reads better than wrapped text.
"src/agent/survey/reader.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
